---
- name: Instalar Containerd y herramientas de Kubernetes
  hosts: all
  become: true
  tasks:
    - name: Instalar dependencias base
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - socat
          - conntrack
          - ipset
          - ebtables
        state: present

    - name: Agregar clave GPG oficial de Docker (para containerd)
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Agregar repositorio de Docker
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Actualizar caché APT (Docker repo)
      apt:
        update_cache: yes

    - name: Instalar containerd
      apt:
        name: containerd.io
        state: present

    - name: Asegurar directorio de configuración de containerd
      file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configurar containerd para usar systemd como cgroup driver
      shell: |
        containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml
      notify: Restart containerd

    - name: Habilitar plugin CRI en containerd (requerido por kubeadm/kubelet)
      replace:
        path: /etc/containerd/config.toml
        regexp: '^disabled_plugins\s*=\s*\["cri"\]\s*$'
        replace: "disabled_plugins = []"
      notify: Restart containerd

    - name: Habilitar SystemdCgroup en containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: '^(\s*SystemdCgroup\s*=\s*)false\s*$'
        replace: '\1true'
      notify: Restart containerd

    - name: Agregar clave GPG de Kubernetes
      apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key # Ajustar a la versión deseada
        state: present

    - name: Agregar repositorio de Kubernetes
      apt_repository:
        repo: deb https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /
        state: present

    - name: Actualizar caché APT (Kubernetes repo)
      apt:
        update_cache: yes

    - name: Instalar kubelet, kubeadm y kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Retener las versiones (Hold) para evitar actualizaciones accidentales
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

  handlers:
    - name: Restart containerd
      service:
        name: containerd
        state: restarted
        enabled: yes
