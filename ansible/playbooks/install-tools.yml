---
- name: Instalar Containerd y herramientas de Kubernetes
  hosts: all
  become: true
  # NOTA: La variable 'kubernetes_version' se define en:
  # ansible/inventory/group_vars/all.yml
  tasks:
    - name: Instalar dependencias base
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - socat
          - conntrack
          - ipset
          - ebtables
        state: present

    - name: Crear directorio de keyrings del sistema
      file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Descargar clave GPG de Docker (método moderno, Ubuntu 22.04+)
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    - name: Agregar repositorio de Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Actualizar caché APT (Docker repo)
      apt:
        update_cache: yes

    - name: Instalar containerd
      apt:
        name: containerd.io
        state: present

    - name: Asegurar directorio de configuración de containerd
      file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configurar containerd con template optimizado para Kubernetes
      copy:
        dest: /etc/containerd/config.toml
        content: |
          version = 2
          [plugins]
            [plugins."io.containerd.grpc.v1.cri"]
              systemd_cgroup = true
          [plugins."io.containerd.grpc.v1.cri".containerd]
            default_runtime_name = "runc"
            [plugins."io.containerd.grpc.v1.cri".containerd.runtimes]
              [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
                runtime_type = "io.containerd.runc.v2"
                [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
                  SystemdCgroup = true
        owner: root
        group: root
        mode: "0644"
      notify: Restart containerd

    - name: Descargar clave GPG de Kubernetes (método moderno)
      get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key"
        dest: "/etc/apt/keyrings/kubernetes-{{ kubernetes_version }}.asc"
        mode: "0644"
        force: false

    - name: Agregar repositorio de Kubernetes
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-{{ kubernetes_version }}.asc] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /"
        state: present
        filename: "kubernetes-{{ kubernetes_version }}"

    - name: Actualizar caché APT (Kubernetes repo)
      apt:
        update_cache: yes

    - name: Instalar kubelet, kubeadm y kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Asegurar directorio de drop-ins de kubelet
      file:
        path: /etc/systemd/system/kubelet.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Comprobar si existe resolv.conf de systemd-resolved
      stat:
        path: /run/systemd/resolve/resolv.conf
      register: systemd_resolv

    - name: Configurar kubelet para usar resolv.conf de systemd-resolved
      copy:
        dest: /etc/systemd/system/kubelet.service.d/20-resolv-conf.conf
        content: |
          [Service]
          Environment="KUBELET_EXTRA_ARGS=--resolv-conf=/run/systemd/resolve/resolv.conf"
        owner: root
        group: root
        mode: "0644"
      when: systemd_resolv.stat.exists

    - name: Recargar systemd y reiniciar kubelet
      systemd:
        daemon_reload: true
        name: kubelet
        state: restarted
        enabled: yes

    - name: Retener las versiones (Hold) para evitar actualizaciones accidentales
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

  handlers:
    - name: Restart containerd
      service:
        name: containerd
        state: restarted
        enabled: yes
