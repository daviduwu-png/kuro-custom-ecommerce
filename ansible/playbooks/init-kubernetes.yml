---
- name: Inicializar control plane (kubeadm init)
  hosts: role_Control_Plane, role_control_plane
  become: true
  # NOTA: Las variables pod_network_cidr, flannel_version y kubeconfig_user
  # se definen en ansible/inventory/group_vars/all.yml
  tasks:
    - name: Crear archivo de configuracion de kubeadm con TLS bootstrap
      copy:
        dest: /tmp/kubeadm-config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          apiVersion: kubeadm.k8s.io/v1beta3
          kind: InitConfiguration
          localAPIEndpoint:
            advertiseAddress: "{{ ansible_default_ipv4.address }}"
            bindPort: 6443
          nodeRegistration:
            name: "{{ inventory_hostname }}"
          ---
          apiVersion: kubeadm.k8s.io/v1beta3
          kind: ClusterConfiguration
          networking:
            podSubnet: "{{ pod_network_cidr }}"
          ---
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          # Habilita que cada kubelet solicite su propio cert de servidor via CSR.
          # Los CSRs se aprueban en el play 'Aprobar CSRs de kubelet-serving' al final.
          serverTLSBootstrap: true

    - name: Inicializar Kubernetes control plane (solo una vez)
      command: kubeadm init --config /tmp/kubeadm-config.yaml
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Crear directorio .kube para usuario
      file:
        path: "/home/{{ kubeconfig_user }}/.kube"
        state: directory
        owner: "{{ kubeconfig_user }}"
        group: "{{ kubeconfig_user }}"
        mode: "0755"

    - name: Copiar kubeconfig admin.conf al usuario
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ kubeconfig_user }}/.kube/config"
        remote_src: true
        owner: "{{ kubeconfig_user }}"
        group: "{{ kubeconfig_user }}"
        mode: "0644"

    # CRÍTICO: Parchear manifests con probes tolerantes y 127.0.0.1 antes de que kubelet los levante para evitar fallos de etcd/apiserver.

    - name: Parchear etcd – probes más tolerantes
      shell: |
        python3 << 'PYEOF'
        import yaml, copy

        path = "/etc/kubernetes/manifests/etcd.yaml"
        with open(path) as f:
            manifest = yaml.safe_load(f)

        container = manifest["spec"]["containers"][0]

        for probe_key in ("livenessProbe", "startupProbe"):
            probe = container.get(probe_key, {})
            probe["initialDelaySeconds"] = 60
            probe["timeoutSeconds"]      = 30
            probe["failureThreshold"]    = 40
            container[probe_key] = probe

        with open(path, "w") as f:
            yaml.dump(manifest, f, default_flow_style=False)
        print("etcd manifest patched OK")
        PYEOF
      args:
        executable: /bin/bash

    - name: Parchear kube-apiserver – usar 127.0.0.1, eliminar readinessProbe agresivo
      shell: |
        python3 << 'PYEOF'
        import yaml

        path = "/etc/kubernetes/manifests/kube-apiserver.yaml"
        with open(path) as f:
            manifest = yaml.safe_load(f)

        container = manifest["spec"]["containers"][0]

        # Liveness: 127.0.0.1, esperar 120 s antes de empezar
        container["livenessProbe"] = {
            "failureThreshold": 8,
            "httpGet": {
                "host":   "127.0.0.1",
                "path":   "/livez",
                "port":   6443,
                "scheme": "HTTPS",
            },
            "initialDelaySeconds": 120,
            "periodSeconds":       10,
            "timeoutSeconds":      15,
        }

        # Startup: 127.0.0.1, arranca a checar rápido pero tolera 5 min
        container["startupProbe"] = {
            "failureThreshold": 30,
            "httpGet": {
                "host":   "127.0.0.1",
                "path":   "/livez",
                "port":   6443,
                "scheme": "HTTPS",
            },
            "initialDelaySeconds": 10,
            "periodSeconds":       10,
            "timeoutSeconds":      15,
        }

        # Eliminar readinessProbe – en un nodo único solo causa falsos negativos
        container.pop("readinessProbe", None)

        with open(path, "w") as f:
            yaml.dump(manifest, f, default_flow_style=False)
        print("kube-apiserver manifest patched OK")
        PYEOF
      args:
        executable: /bin/bash

    - name: Recargar kubelet para que aplique los manifests parcheados
      service:
        name: kubelet
        state: restarted

    - name: Esperar a que el API Server esté completamente listo
      become_user: "{{ kubeconfig_user }}"
      command: kubectl get --raw=/healthz
      register: apiserver_health
      changed_when: false
      retries: 40
      delay: 10
      until: apiserver_health.rc == 0

    - name: Instalar CNI (Flannel)
      become_user: "{{ kubeconfig_user }}"
      command: "kubectl apply --validate=false -f https://raw.githubusercontent.com/flannel-io/flannel/{{ flannel_version }}/Documentation/kube-flannel.yml"
      register: flannel_apply
      changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"
      retries: 12
      delay: 10
      until: flannel_apply.rc == 0

    - name: Obtener comando de join para workers
      command: kubeadm token create --print-join-command
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: join_cmd
      changed_when: false
      retries: 15
      delay: 10
      until: join_cmd.rc == 0

    - name: Guardar join command como fact del control plane
      set_fact:
        kubeadm_join_command: "{{ join_cmd.stdout }}"

    - name: Instalar Metrics Server (Requerido para HPA)
      become_user: "{{ kubeconfig_user }}"
      command: "kubectl apply --validate=false -f https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml"
      register: metrics_apply
      changed_when: "'created' in metrics_apply.stdout or 'configured' in metrics_apply.stdout"
      retries: 10
      delay: 10
      until: metrics_apply.rc == 0


- name: Unir workers al cluster (kubeadm join)
  hosts: role_Worker_Node, role_worker_node
  become: true
  tasks:
    - name: Unir nodo worker al cluster
      command: "{{ hostvars[(groups['role_Control_Plane'] | default(groups['role_control_plane'], true))[0]].kubeadm_join_command }} --node-name={{ inventory_hostname }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
      register: worker_join
      retries: 10
      delay: 15
      until: worker_join.rc == 0

# Con serverTLSBootstrap: true, cada kubelet (control plane + workers) genera
# un CSR de tipo 'kubernetes.io/kubelet-serving' que debe ser aprobado
# explicitamente por un administrador o por este play.
# Sin esta aprobacion, Metrics Server no puede hacer scraping de los kubelets.
- name: Aprobar CSRs de kubelet-serving (habilita Metrics Server con TLS real)
  hosts: role_Control_Plane, role_control_plane
  become: false
  tasks:
    - name: Esperar a que todos los nodos generen sus CSRs de serving
      become_user: "{{ kubeconfig_user }}"
      shell: |
        kubectl get csr --no-headers 2>/dev/null \
          | grep -c 'Pending' || echo 0
      register: pending_count
      until: pending_count.stdout | int >= ((groups['role_Worker_Node'] | default(groups['role_worker_node'], true)) | length + 1)
      retries: 20
      delay: 10
      changed_when: false

    - name: Aprobar todos los CSRs de kubelet-serving pendientes
      become_user: "{{ kubeconfig_user }}"
      shell: |
        pending=$(kubectl get csr --no-headers 2>/dev/null \
          | grep 'Pending' | awk '{print $1}')
        if [ -n "$pending" ]; then
          kubectl certificate approve $pending
          echo "Aprobados: $pending"
        else
          echo "Sin CSRs pendientes"
        fi
      register: csr_approval
      changed_when: "'Aprobados' in csr_approval.stdout"

    - name: Verificar que Metrics Server tiene endpoints disponibles
      become_user: "{{ kubeconfig_user }}"
      command: kubectl top nodes
      register: top_nodes
      retries: 15
      delay: 10
      until: top_nodes.rc == 0
      changed_when: false
