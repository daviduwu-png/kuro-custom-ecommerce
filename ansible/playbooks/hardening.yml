---
- name: Preparar Sistema Operativo para Kubernetes
  hosts: all
  become: true
  tasks:
    - name: Actualizar repositorios APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Disable SWAP
      command: swapoff -a
      changed_when: true

    - name: Desactivar SWAP de forma permanente en /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Enable kernel modules
      command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: true

    - name: Persistir módulos del kernel para reinicios
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Escribir parámetros sysctl para red de Kubernetes
      copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        owner: root
        group: root
        mode: "0644"

    - name: Aplicar sysctl (recargar configuración)
      command: sysctl --system
      changed_when: true
