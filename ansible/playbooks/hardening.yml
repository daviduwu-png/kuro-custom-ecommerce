---
- name: Preparar Sistema Operativo para Kubernetes
  hosts: all
  become: true
  tasks:
    - name: Actualizar repositorios APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Disable SWAP
      command: swapoff -a
      changed_when: true

    - name: Desactivar SWAP de forma permanente en /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Enable kernel modules
      command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: true

    - name: Persistir módulos del kernel para reinicios
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Escribir parámetros sysctl para red de Kubernetes
      copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        owner: root
        group: root
        mode: "0644"

    - name: Aplicar sysctl (recargar configuración)
      command: sysctl --system
      changed_when: true

    - name: Asegurar resolución de hostname local (Previene crashloop de kubeadm en AWS)
      lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+.*'
        line: "127.0.1.1 {{ inventory_hostname }}"
        state: present

    # -------------------------------------------------------------------------
    # Hardening SSH — principio de mínimo privilegio en el acceso remoto.
    # Desactiva autenticación por contraseña, acceso root, y reenvío X11.
    # Reduce el número de intentos de autenticación para mitigar fuerza bruta.
    # -------------------------------------------------------------------------
    - name: Hardening SSH — deshabilitar autenticación por contraseña
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present

    - name: Hardening SSH — deshabilitar login como root
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present

    - name: Hardening SSH — deshabilitar X11Forwarding
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?X11Forwarding'
        line: 'X11Forwarding no'
        state: present

    - name: Hardening SSH — limitar intentos de autenticación a 3
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?MaxAuthTries'
        line: 'MaxAuthTries 3'
        state: present

    - name: Hardening SSH — deshabilitar reenvío de agente TCP
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?AllowTcpForwarding'
        line: 'AllowTcpForwarding no'
        state: present

    - name: Hardening SSH — reducir timeout de autenticación a 30 segundos
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?LoginGraceTime'
        line: 'LoginGraceTime 30'
        state: present

    - name: Reiniciar sshd para aplicar cambios de hardening
      service:
        name: sshd
        state: restarted

