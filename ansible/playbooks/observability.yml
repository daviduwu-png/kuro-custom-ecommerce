---
# Stack de Observabilidad: Prometheus + Node Exporter + Grafana
#
# Los manifiestos viven en: k8s-manifests/monitoring/
# Este playbook los renderiza (sustituyendo versiones de imagen) y los aplica en orden.
# Se usa 'template' en lugar de 'copy' para que Ansible resuelva las variables
# {{ prometheus_version }}, {{ node_exporter_version }} y {{ grafana_version }}
# definidas en ansible/inventory/group_vars/all.yml.
#
# Acceso post-despliegue:
#   Prometheus → http://<worker-ip>:30090
#   Grafana    → http://<worker-ip>:30300  (admin / kuro-grafana-2024)

- name: Desplegar stack de Observabilidad (Prometheus + Node Exporter + Grafana)
  hosts: kuro-control-plane-01
  become: false

  vars:
    monitoring_src: "{{ playbook_dir }}/../../k8s-manifests/monitoring"
    monitoring_dest: "/home/{{ kubeconfig_user }}/monitoring"
    dashboards_src: "{{ playbook_dir }}/../../k8s-manifests/monitoring/dashboards"
    dashboards_dest: "/home/{{ kubeconfig_user }}/monitoring/dashboards"
    monitoring_manifests:
      - 00-namespace.yaml
      - 01-node-exporter.yaml
      - 02-prometheus-rbac.yaml
      - 03-prometheus-config.yaml
      - 04-prometheus-deploy.yaml
      - 05-grafana-secret.yaml
      - 06-grafana-provisioning.yaml
      - 07-grafana.yaml

  tasks:

    - name: Crear directorio de staging en el control plane
      become_user: "{{ kubeconfig_user }}"
      file:
        path: "{{ monitoring_dest }}"
        state: directory
        mode: "0755"

    - name: Crear directorio de dashboards en el control plane
      become_user: "{{ kubeconfig_user }}"
      file:
        path: "{{ dashboards_dest }}"
        state: directory
        mode: "0755"

    - name: Copiar dashboards JSON al control plane
      become_user: "{{ kubeconfig_user }}"
      copy:
        src: "{{ dashboards_src }}/{{ item }}"
        dest: "{{ dashboards_dest }}/{{ item }}"
        mode: "0644"
      loop:
        - node-exporter.json
        - cadvisor.json

    - name: Renderizar manifiestos al control plane (sustituye versiones de imagen)
      become_user: "{{ kubeconfig_user }}"
      template:
        src: "{{ monitoring_src }}/{{ item }}"
        dest: "{{ monitoring_dest }}/{{ item }}"
        mode: "0644"
      loop: "{{ monitoring_manifests }}"

    - name: Aplicar namespace de monitoring (requerido antes del ConfigMap)
      become_user: "{{ kubeconfig_user }}"
      command: "kubectl apply -f {{ monitoring_dest }}/00-namespace.yaml"
      register: ns_apply
      changed_when: "'created' in ns_apply.stdout or 'configured' in ns_apply.stdout"

    - name: Crear/actualizar ConfigMap de dashboards desde los JSON
      become_user: "{{ kubeconfig_user }}"
      shell: >
        kubectl create configmap grafana-dashboards-json
        --from-file={{ dashboards_dest }}/node-exporter.json
        --from-file={{ dashboards_dest }}/cadvisor.json
        -n monitoring
        --dry-run=client -o yaml | kubectl apply -f -
      register: dashboards_cm_apply
      changed_when: "'configured' in dashboards_cm_apply.stdout or 'created' in dashboards_cm_apply.stdout"

    - name: Aplicar manifiestos de observabilidad (en orden)
      become_user: "{{ kubeconfig_user }}"
      command: "kubectl apply -f {{ monitoring_dest }}/{{ item }}"
      loop: "{{ monitoring_manifests }}"
      register: monitoring_apply
      changed_when: "'created' in monitoring_apply.stdout or 'configured' in monitoring_apply.stdout"

    - name: Esperar a que Prometheus esté Ready
      become_user: "{{ kubeconfig_user }}"
      command: kubectl rollout status deployment/prometheus -n monitoring --timeout=120s
      register: prometheus_rollout
      until: prometheus_rollout.rc == 0
      changed_when: false
      retries: 3
      delay: 15

    - name: Esperar a que Grafana esté Ready
      become_user: "{{ kubeconfig_user }}"
      command: kubectl rollout status deployment/grafana -n monitoring --timeout=120s
      register: grafana_rollout
      until: grafana_rollout.rc == 0
      changed_when: false
      retries: 5
      delay: 20

    - name: Verificar pods del stack de observabilidad
      become_user: "{{ kubeconfig_user }}"
      command: kubectl get pods -n monitoring
      changed_when: false
