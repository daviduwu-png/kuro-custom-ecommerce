---
# Variables globales del cluster Kuro Custom
# Este archivo es la ÚNICA fuente de verdad para versiones de componentes.
# Antes de cambiar kubernetes_version, verificar la matriz de compatibilidad:
# https://kubernetes.io/releases/version-skew-policy/
#
# Matriz de compatibilidad validada para este proyecto:
#
#   Kubernetes | Containerd | Calico   | Metrics Server
#   -----------|------------|----------|---------------
#   v1.29      | >= 1.6.x   | v3.27.x  | v0.7.2
#   v1.30      | >= 1.7.x   | v3.28.x  | v0.7.2+
#   v1.31      | >= 1.7.x   | v3.28.x  | v0.7.2+
#
# REGLA: Si cambias kubernetes_version, actualiza también calico_version
# y metrics_server_version. Usa SIEMPRE el formato "vX.Y" (sin patch) para el repo APT.

# Version del repositorio APT de Kubernetes (formato: "vX.Y")
# Controla: kubelet, kubeadm, kubectl
kubernetes_version: "v1.29"

# Versión de Calico CNI — debe ser compatible con la versión de K8s
# Referencia: https://github.com/projectcalico/calico/releases
# Calico >= v3.25 soporta K8s 1.29+
calico_version: "v3.28.0"

# Versión de Metrics Server
# Referencia: https://github.com/kubernetes-sigs/metrics-server/releases
metrics_server_version: "v0.7.2"

# Usuario del sistema operativo en las instancias EC2
kubeconfig_user: "ubuntu"

# CIDR para la red de pods (Calico default: 192.168.0.0/16)
# IMPORTANTE: Este CIDR debe coincidir con el configurado en el manifest de Calico.
# Calico usa 192.168.0.0/16 por defecto; Flannel usaba 10.244.0.0/16.
pod_network_cidr: "192.168.0.0/16"

# Stack de Observabilidad
# Referencia Prometheus: https://github.com/prometheus/prometheus/releases
prometheus_version: "v2.53.0"

# Referencia Node Exporter: https://github.com/prometheus/node_exporter/releases
node_exporter_version: "v1.8.1"

# Referencia Grafana: https://github.com/grafana/grafana/releases
grafana_version: "11.1.0"
