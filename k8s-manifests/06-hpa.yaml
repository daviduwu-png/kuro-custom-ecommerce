apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kuro-backend-hpa
  namespace: kuro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kuro-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kuro-frontend-hpa
  namespace: kuro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kuro-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
