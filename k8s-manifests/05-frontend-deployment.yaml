apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuro-frontend
  namespace: kuro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kuro-frontend
  template:
    metadata:
      labels:
        app: kuro-frontend
    spec:
      # Distribuir equitativamente los pods entre los diferentes worker nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: kuro-frontend
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: davidnicanor123/kuro-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: kuro-frontend-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health.txt
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health.txt
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
