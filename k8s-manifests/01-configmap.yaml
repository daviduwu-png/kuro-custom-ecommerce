apiVersion: v1
kind: ConfigMap
metadata:
  name: kuro-backend-config
  namespace: kuro
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "kurocustom.uk,www.kurocustom.uk"
  FRONTEND_URL: "https://kurocustom.uk"
  BACKEND_URL: "https://kurocustom.uk"
  CORS_ALLOWED_ORIGINS: "https://kurocustom.uk,https://www.kurocustom.uk"
  CSRF_TRUSTED_ORIGINS: "https://kurocustom.uk,https://www.kurocustom.uk"
  # IMPORTANTE: El valor real de DB_HOST es inyectado por el pipeline de GitHub Actions.
  # Para desarrollo local, reemplaza DEPLOY_TIME_DB_HOST con el endpoint de tu RDS.
  DB_HOST: "DEPLOY_TIME_DB_HOST"
  DB_NAME: "kurodb"
  DB_USER: "postgres"
  DB_PORT: "5432"
  SECURE_SSL_REDIRECT: "True"
  DJANGO_SUPERUSER_USERNAME: "kuroadmin"
  DJANGO_SUPERUSER_EMAIL: "admin@kurocustom.uk"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kuro-frontend-config
  namespace: kuro
data:
  PUBLIC_API_URL: "https://kurocustom.uk/api"
  API_URL_INTERNAL: "http://kuro-backend:8000/api"
