name: Despliegue Capa 0 y 3 (App y K8s)

on:
  push:
    branches: ["main"]
    paths:
      - "kuro-frontend/**"
      - "kuro-backend/**"
      - "k8s-manifests/*.yaml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Log in a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./kuro-backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kuro-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./kuro-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kuro-frontend:latest
          build-args: |
            PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
            PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.PUBLIC_GOOGLE_CLIENT_ID }}
            PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}

  deploy-kubernetes:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Configurar llave SSH del Control Plane
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/kuro-custom-key.pem
          chmod 600 ~/.ssh/kuro-custom-key.pem

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Obtener IP del Control Plane dinámicamente
        id: get-ip
        run: |
          # Busca la EC2 que esté encendida y tenga el Tag Rol=Control_Plane
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Rol,Values=Control_Plane" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].PublicIpAddress" \
            --output text)
          echo "La IP detectada es: $IP"
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Abrir SSH temporal para el runner de GitHub Actions
        id: ssh-open
        run: |
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com)/32"
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=sg_kuro_custom" \
            --query "SecurityGroups[0].GroupId" \
            --output text)

          echo "Runner IP: $RUNNER_IP"
          echo "Security Group: $SG_ID"

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP,Description='Temporal: GitHub Actions runner - auto-eliminado al final del job (App)'}]"

          # Exportar variables para que los siguientes pasos las usen
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "SG_ID=$SG_ID" >> $GITHUB_ENV

      - name: Inyectar secrets reales en secret.yaml (desde GitHub Secrets)
        run: |
          sed -i "s|DEPLOY_TIME_SECRET_KEY|${{ secrets.DJANGO_SECRET_KEY }}|g" k8s-manifests/02-secret.yaml
          sed -i "s|DEPLOY_TIME_DB_PASSWORD|${{ secrets.DB_PASSWORD }}|g" k8s-manifests/02-secret.yaml
          sed -i "s|DEPLOY_TIME_SUPERUSER_PASSWORD|${{ secrets.DJANGO_SUPERUSER_PASSWORD }}|g" k8s-manifests/02-secret.yaml
          sed -i "s|DEPLOY_TIME_DB_HOST|${{ secrets.DB_HOST }}|g" k8s-manifests/01-configmap.yaml

      - name: Copiar manifiestos y Aplicar (Capa 3)
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/kuro-custom-key.pem -r k8s-manifests ubuntu@${{ steps.get-ip.outputs.ip }}:/home/ubuntu/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/kuro-custom-key.pem ubuntu@${{ steps.get-ip.outputs.ip }} "kubectl apply -f k8s-manifests/"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/kuro-custom-key.pem ubuntu@${{ steps.get-ip.outputs.ip }} "kubectl rollout restart deployment -n kuro kuro-backend kuro-frontend"

      - name: Cerrar SSH temporal del runner
        if: always() && steps.ssh-open.outcome == 'success'
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP" \
          || echo "La regla ya no existe"
        env:
          SG_ID: ${{ env.SG_ID }}
          RUNNER_IP: ${{ env.RUNNER_IP }}
